name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Weekly, so a dependency release is tested even when nothing is pushed.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event, so a push to main never cancels the weekly run or vice versa.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv run --with flake8 flake8 altr_mcp/ tests/ scripts/ .github/scripts/

  test:
    name: test (python ${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every version requires-python permits. The wheel is py3-none-any,
        # so the interpreter does not change the artifact -- this is about
        # whether the code runs on the versions the package claims to
        # support. Kept in step with the classifiers in pyproject.toml by
        # test_python_support_is_consistent.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run pytest tests/ -x

  test-newest:
    # A fresh install ignores the lockfile and resolves per interpreter, like
    # pip and uvx do. Test that, so a behavior change fails here first.
    name: test (newest dependencies, python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv venv && uv pip install -e ".[dev]"
      - run: .venv/bin/python -m pytest tests/ -rfE | tee pytest.log
        shell: bash
      - name: Summarize what the newest versions broke
        if: failure() && github.event_name == 'schedule'
        shell: bash
        run: |
          uv export --frozen --no-hashes --extra dev > lock-pins.txt
          uv pip freeze > installed.txt
          { echo "### Python ${{ matrix.python-version }}"; echo
            python3 .github/scripts/summarize_findings.py newest pytest.log lock-pins.txt installed.txt
          } > findings.md
      - if: failure() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: findings-newest-py${{ matrix.python-version }}
          path: findings.md

  test-redaction:
    # fastmcp reports a rejected argument three ways across the allowed range.
    # Keep the redaction tests running on each.
    name: test redaction (fastmcp ${{ matrix.fastmcp }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        fastmcp: ["3.2.4", "3.4.2"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]" "fastmcp==${{ matrix.fastmcp }}"
      - run: .venv/bin/python -m pytest tests/unit/test_logging.py tests/unit/test_middleware.py

  report-failure:
    # A scheduled run has no pull request to show its result, so a finding
    # opens an issue assigned to the maintainers.
    needs: [test-newest]
    # A job that times out ends as cancelled, not failed, so check both.
    if: >-
      always() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        continue-on-error: true  # nothing to download if the check never finished
        with:
          pattern: findings-*
          path: findings
      - run: .github/scripts/report-scheduled-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_NAME: Weekly dependency check
          FINDINGS_DIR: findings
          ISSUE_ASSIGNEES: altr-andrea,altrparker
