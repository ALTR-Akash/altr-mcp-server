name: Publish to PyPI

on:
  push:
    # Numeric segments only — `v0.2.1-rc1` and other pre-releases will NOT match.
    # If you want a pre-release tag to trigger a TestPyPI flow, add a separate job.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verify tests pass before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest tests/ -x

  verify-release:
    name: Verify release metadata matches the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # v0.5.2 was tagged on a commit whose pyproject.toml still read 0.5.1.
      # `uv build` produced altr_mcp-0.5.1 and PyPI rejected the upload with
      # "400 File already exists". Nothing compared the two, so the mismatch
      # only surfaced after the release had already failed.
      #
      # Once the version is derived from the tag (#9), the built-version check
      # narrows to catching a broken checkout: with no tag reachable from HEAD
      # the build silently yields 0.0.0.post1.dev0+<sha> rather than erroring.
      # The CHANGELOG check is the part that keeps catching human omissions.
      - name: Check the built version and the changelog against the tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          rm -rf dist
          uv build >/dev/null

          # Parse the version out of the wheel name rather than sed'ing the
          # path: a non-matching sed silently passes its input through, which
          # would report a filename as the "built version".
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          built=$(basename "${wheels[0]}")
          built=${built#altr_mcp-}
          built=${built%%-*}
          echo "tag=$version built=$built"

          fail=0
          if [ "$built" != "$version" ]; then
            echo "::error::built version $built does not match tag $version"
            fail=1
          fi
          # Requires a non-empty "## [$version]" section that is the *newest*
          # one in the file — see scripts/check_changelog.py. It lives there
          # rather than inline so tests/unit/test_check_changelog.py can cover
          # it; as shell in this file it only ever ran during a real release.
          # stdlib-only, so it needs no uv environment.
          python3 scripts/check_changelog.py "$version" CHANGELOG.md || fail=1

          exit $fail

  publish:
    name: Build and publish to PyPI
    needs: [test, verify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing
      contents: read    # actions/checkout; a job-level block replaces the
                        # workflow-level one wholesale, so this is not inherited
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-mcp:
    name: Publish to MCP Registry
    needs: publish            # only after the PyPI upload succeeds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write         # GitHub OIDC — proves the io.github.altrsoftware namespace
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the release version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # The committed server.json is what gets published; this job no longer
      # rewrites it. It cannot disagree with the tag by the time we get here:
      # the `test` job asserts server.json matches the newest CHANGELOG
      # section, `verify-release` asserts the tag matches that same section,
      # and `publish` needs both. This confirms the result at the boundary
      # rather than trusting that chain, because publishing is irreversible.
      #
      # `.packages[] == …` over an empty array is vacuously true, so the
      # length check is load-bearing.
      - name: Check server.json matches the tag
        run: |
          jq -e --arg v "$VERSION" '
            .version == $v
            and (.packages | length) > 0
            and all(.packages[]; .version == $v)
          ' server.json > /dev/null || {
            echo "::error::server.json does not record $VERSION -- see docs/releasing.md step 2"
            jq '{version, packages: [.packages[].version]}' server.json
            exit 1
          }
          echo "server.json records $VERSION"

      # The registry re-validates the PyPI package (and its mcp-name token) at
      # publish time, so wait until the tagged version is actually queryable.
      - name: Wait for the release on PyPI
        run: |
          version="$VERSION"
          echo "Waiting for altr-mcp==$version to appear on PyPI..."
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/altr-mcp/$version/json" >/dev/null 2>&1; then
              echo "Found altr-mcp==$version on PyPI."
              exit 0
            fi
            echo "  not yet (attempt $i); retrying in 10s"
            sleep 10
          done
          echo "::error::altr-mcp==$version did not appear on PyPI in time"
          exit 1

      # Pinned by version *and* digest, rather than tracking releases/latest.
      # This binary is executed in a job holding id-token: write for the
      # io.github.altrsoftware namespace, so whatever runs here can publish as
      # us. Tracking `latest` means an upstream release — or a replaced asset
      # on an existing one — silently changes what we execute.
      #
      # The digest is committed here on purpose. Verifying against the
      # checksums.txt from the same release would only catch a corrupt
      # download: anyone able to replace the tarball can replace the checksum
      # file alongside it.
      #
      # VERSION and SHA256 move together. To update: pick the release, then
      # take the mcp-publisher_linux_amd64.tar.gz line from its
      # registry_<ver>_checksums.txt. See docs/releasing.md.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.0
          MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          set -euo pipefail

          # The pinned digest is for a specific platform build, so fail
          # clearly rather than confusingly if the runner image ever changes.
          if [ "$(uname -s)" != "Linux" ] || [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::pinned mcp-publisher is linux_amd64; runner is $(uname -s)/$(uname -m)"
            exit 1
          fi

          # --fail matters: without it a 404 or an error page is written out
          # as a success and piped straight into tar.
          curl --fail --silent --show-error --location \
            -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"

          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict

          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz
          echo "installed mcp-publisher ${MCP_PUBLISHER_VERSION}"

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP Registry
        run: ./mcp-publisher publish
