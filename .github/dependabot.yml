version: 2
updates:
  # Python dependencies: pyproject.toml ranges and uv.lock.
  - package-ecosystem: uv
    directory: /
    # Keep published lower bounds; only widen a cap a new release falls outside.
    versioning-strategy: widen
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Patch releases share one pull request; minor and major get their own.
      patch:
        update-types: [patch]

  # Actions referenced in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    commit-message:
      prefix: ci
    groups:
      # Minor and patch share one pull request; each major gets its own.
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
